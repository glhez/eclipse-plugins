name: Java CI and Publish with Maven
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
    - name: build
      run: |
        base64 --decode > "${KEYSTORE_PATH}" <<< "${{ secrets.KEYSTORE_DATA }}"
        ./mvnw -B verify -DperformRelease=true
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_KEY }}
        KEYSTORE_PATH: ${{ github.workspace }}/code-signing.keystore"
    - name: Copy site index
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        cp -v site/index.md com.github.glhez.eclipse.releng.updatesite/target/repository
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
      with:
        branch: gh-pages
        folder: com.github.glhez.eclipse.releng.updatesite/target/repository

